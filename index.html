<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Vibranto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f13;
    color: #fff;
    overscroll-behavior: none;
  }
  main {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  p.sub {
    opacity: 0.6;
    font-size: 0.95rem;
    max-width: 320px;
  }
  #vibeBtn {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(145deg, #3a3aff, #7b2ff7);
    box-shadow: 0 10px 40px rgba(123, 47, 247, 0.45);
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  #vibeBtn:active { transform: scale(0.94); }
  #vibeBtn.on {
    background: linear-gradient(145deg, #ff3b5c, #ff7b2f);
    box-shadow: 0 10px 40px rgba(255, 59, 92, 0.55);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  #status {
    min-height: 1.4em;
    font-size: 0.95rem;
    opacity: 0.85;
  }
</style>
</head>
<body>
<main>
  <h1>Vibranto</h1>
  <button id="vibeBtn" type="button">START</button>
  <div id="status">Tap to start infinite vibration</div>
  <p class="sub">Works on Android Chrome. iOS Safari does not support the Vibration API.</p>
</main>
<script>
  const btn = document.getElementById('vibeBtn');
  const status = document.getElementById('status');
  let vibrating = false;
  let intervalId = null;

  const supported = 'vibrate' in navigator;

  function startVibration() {
    // Keep the vibration going "infinitely" by re-triggering it on an interval.
    // A single navigator.vibrate() call is capped by the OS, so we loop it.
    try { navigator.vibrate(0); } catch (e) {}
    navigator.vibrate([500, 200, 500]);
    intervalId = setInterval(() => {
      navigator.vibrate([500, 200, 500]);
    }, 1200);
    vibrating = true;
    btn.textContent = 'STOP';
    btn.classList.add('on');
    status.textContent = 'Vibrating… tap again to stop';
  }

  function stopVibration() {
    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }
    try { navigator.vibrate(0); } catch (e) {}
    vibrating = false;
    btn.textContent = 'START';
    btn.classList.remove('on');
    status.textContent = 'Stopped. Tap to start again';
  }

  btn.addEventListener('click', () => {
    if (!supported) {
      status.textContent = 'Vibration API not supported on this device/browser';
      return;
    }
    if (vibrating) {
      stopVibration();
    } else {
      startVibration();
    }
  });

  // Safety: stop vibrating if the page is hidden/closed.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && vibrating) stopVibration();
  });
  window.addEventListener('pagehide', () => {
    if (vibrating) stopVibration();
  });
</script>
</body>
</html>
